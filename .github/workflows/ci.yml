name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and formatting
        run: npm run lint
      - name: Check practice details
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate HTML
        run: npm run lint:html
