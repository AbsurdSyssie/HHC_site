#
# Checks this repository's draft without treating incomplete practice details
# as a CI outage. Production publication remains guarded by pages.yml.
#
# Action SHAs were verified against each action's latest release on
# 2026-10-29 and carry the matching `# vX.Y.Z` comment per house style.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Lint, check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and formatting
        run: npm run lint
      - name: Check fictional fixture
        run: npm run check
        env:
          PRACTICE_DIR: tests/fixtures/demo-practice
      - name: Fixture and migration tests
        run: node --test tests/practice.test.js tests/preview.test.js practice/migration.test.js
      - name: Build fictional fixture
        run: npm run build
        env:
          PRACTICE_DIR: tests/fixtures/demo-practice
      - name: Validate fixture HTML
        run: npm run lint:html
      - name: Build personal demonstration
        run: npm run build:demo
      - name: Validate personal demonstration HTML
        run: npx html-validate '_preview/**/*.html'
      - name: Verify production check remains blocked
        run: |
          if output=$(npm run check 2>&1); then
            echo 'Expected the unapproved practice content to remain blocked.' >&2
            exit 1
          fi
          printf '%s\n' "$output"
          grep -q 'content_last_reviewed' <<< "$output"
          grep -q 'earnings.*financial_year' <<< "$output"

  reuse:
    name: REUSE compliance
    if: github.repository == 'pacharanero/open-gp-practice-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflow-security:
    name: GitHub Actions security
    if: github.repository == 'pacharanero/open-gp-practice-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: zizmor@1.31.1
          fallback: none
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}
