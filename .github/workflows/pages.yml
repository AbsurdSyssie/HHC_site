#
# Production publication is manual and always runs the real practice check.
# This personal demonstration repository is not configured to publish via
# GitHub Pages; its draft is uploaded separately to Cloudflare Pages.
#
# One-off setup in each repository: Settings > Pages > Source must be set to
# "GitHub Actions". In a fork, Actions must also be switched on from the
# Actions tab first.
#
# Action SHAs were verified against each action's latest release on
# 2026-10-29 and carry the matching `# vX.Y.Z` comment per house style.

name: Publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: this job produces what gets published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Check practice details
        run: npm run check
      - name: Tests
        run: npm test
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        # base_path is empty when a custom domain is used, or "/<repo>" otherwise.
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
