# Service names from the old clinics index. No eligibility or treatment advice.
services:
  - name: Minor procedures
    description: Coils, contraceptive implants and ear syringing are listed on the practice's clinics page.
  - name: Vaccinations
    description: Baby immunisations, influenza, pneumonia and shingles vaccinations.
  - name: Family planning and hormone replacement therapy
    description: Listed on the practice's clinics page.
  - name: Postnatal care and cervical screening
    description: Listed on the practice's clinics page.
  - name: Chronic disease clinics
    description: Asthma, COPD, chronic heart disease, chronic kidney disease, diabetes, hypertension and non-diabetic hyperglycaemia.
  - name: Additional services
    description: Anticoagulation, physiotherapy, sexual health, stop smoking and travel vaccinations are listed on the practice's clinics page.

