version = 1

# Configuration, templates and lockfiles: MIT, like the code.
[[annotations]]
path = [
  ".editorconfig",
  ".htmlvalidate.json",
  ".nvmrc",
  ".prettierignore",
  ".prettierrc.json",
  "package.json",
  "package-lock.json",
  "src/**",
]
SPDX-FileCopyrightText = "2026 Marcus Baw"
SPDX-License-Identifier = "MIT"

# Example practice data. MIT, so practices can replace it with their own
# content without taking on any licence obligations.
[[annotations]]
path = ["practice/**", "tests/fixtures/**"]
SPDX-FileCopyrightText = "2026 Marcus Baw"
SPDX-License-Identifier = "MIT"

# Written content: documentation, safety documents and the practice skill.
[[annotations]]
path = ["*.md", "docs/**", "skill/**", "s/README.md"]
SPDX-FileCopyrightText = "2026 Marcus Baw"
SPDX-License-Identifier = "CC-BY-SA-4.0"
